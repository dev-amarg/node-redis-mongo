version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: redis-node-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: aayushi
      MONGO_INITDB_ROOT_PASSWORD: aayushi

  redis:
    image: redis:7-alpine
    container_name: redis-node-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    container_name: redis-node-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://localhost:27017/companyDB
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongo_data:
  redis_data:

