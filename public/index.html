<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Redis + MongoDB CRUD Demo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            /* 🔥 NAYI IMAGE - TILE MODE + TOP 20% CROP 🔥 */
            background-image: url('https://iili.io/CCzf4Rf.jpg');
            background-repeat: repeat;
            background-attachment: scroll;
            background-size: auto;
            background-position: 0% 70%;  /* upar se 20% crop */
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        /* CONTAINER - FULLY TRANSPARENT */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            background: transparent;
            padding: 20px;
            border-radius: 20px;
            box-shadow: none;
        }
        /* FORM - TRANSPARENT */
        form {
            background: transparent;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            border: none;
        }
        /* TABLE - TRANSPARENT */
        table {
            background: transparent;
            border-radius: 16px;
            overflow: hidden;
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1, h2 { 
            color: white;
            text-shadow: 2px 2px 4px black;
            background: rgba(0, 0, 0, 0.5);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
        }
        input, select {
            margin: 5px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.6);
            color: white;
        }
        input::placeholder, select {
            color: rgba(255, 255, 255, 0.8);
        }
        button {
            margin: 5px;
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        button[type="submit"] { background: #007bff; color: white; }
        button.delete { background: #dc3545; color: white; }
        button.edit { background: #ffc107; color: black; }
        #refreshBtn { background: #28a745; color: white; }
        .source {
            font-size: 0.85em;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
        }
        .error {
            color: #ffaaaa;
            background: rgba(0, 0, 0, 0.6);
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
        }
        @media (max-width: 768px) {
            .container { padding: 12px; margin: 10px; }
            th, td { font-size: 12px; padding: 6px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🗄️ Node + Redis + MongoDB CRUD App</h1>

    <h2>➕ Create New User</h2>
    <form id="createForm">
        <input type="text" id="name" placeholder="Name" required>
        <select id="gender" required>
            <option value="">Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <input type="text" id="department" placeholder="Department" required>
        <input type="text" id="designation" placeholder="Designation" required>
        <input type="text" id="city" placeholder="City" required>
        <input type="email" id="email" placeholder="Email" required>
        <button type="submit">✨ Create User</button>
    </form>

    <h2>📋 Users List</h2>
    <button id="refreshBtn">🔄 Refresh List</button>
    <div id="sourceInfo" class="source"></div>
    <div id="errorMessage" class="error"></div>
    <table id="userTable">
        <thead>
            <tr><th>ID</th><th>Name</th><th>Gender</th><th>Dept</th><th>Designation</th><th>City</th><th>Email</th><th>Actions</th></tr>
        </thead>
        <tbody id="userTableBody">
            <td><td colspan="8">Loading... </td></tr>
        </tbody>
    </table>
</div>

<script>
    const API_BASE_URL = '/api/users';

    function showError(msg) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.innerText = msg;
        setTimeout(() => { errorDiv.innerText = ''; }, 5000);
    }

    async function fetchUsers() {
        try {
            const response = await fetch(`${API_BASE_URL}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return data;
        } catch (err) {
            console.error(err);
            showError('Users fetch failed: ' + err.message);
            return [];
        }
    }

    async function renderUsers() {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '<tr><td colspan="8">Loading... </td></tr>';
        const users = await fetchUsers();
        if (!users.length) {
            tbody.innerHTML = '<tr><td colspan="8">No users found</td>';
            document.getElementById('sourceInfo').innerText = '';
            return;
        }
        document.getElementById('sourceInfo').innerHTML = `📊 Total users: ${users.length} (MongoDB + Redis cache)`;
        tbody.innerHTML = users.map(user => `
            <tr>
                <td>${escapeHtml(user._id)}</td>
                <td>${escapeHtml(user.name)}</td>
                <td>${escapeHtml(user.gender)}</td>
                <td>${escapeHtml(user.department)}</td>
                <td>${escapeHtml(user.designation)}</td>
                <td>${escapeHtml(user.city)}</td>
                <td>${escapeHtml(user.email)}</td>
                <td>
                    <button class="edit" onclick="editUser('${user._id}')">✏️ Edit</button>
                    <button class="delete" onclick="deleteUser('${user._id}')">🗑️ Delete</button>
                </td>
            </tr>
        `).join('');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const gender = document.getElementById('gender').value;
        const department = document.getElementById('department').value;
        const designation = document.getElementById('designation').value;
        const city = document.getElementById('city').value;
        const email = document.getElementById('email').value;

        const newUser = { name, gender, department, designation, city, email };
        try {
            const response = await fetch(`${API_BASE_URL}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newUser)
            });
            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || 'Creation failed');
            }
            alert('✅ User created successfully!');
            document.getElementById('createForm').reset();
            renderUsers();
        } catch (err) {
            alert('❌ Error: ' + err.message);
        }
    });

    window.deleteUser = async (userId) => {
        if (!confirm('Are you sure you want to delete this user?')) return;
        try {
            const response = await fetch(`${API_BASE_URL}/${userId}`, { method: 'DELETE' });
            if (!response.ok) throw new Error('Delete failed');
            alert('🗑️ User deleted');
            renderUsers();
        } catch (err) {
            alert('❌ Error: ' + err.message);
        }
    };

    window.editUser = async (userId) => {
        try {
            const res = await fetch(`${API_BASE_URL}/${userId}`);
            if (!res.ok) throw new Error('User not found');
            const user = await res.json();
            const newName = prompt('✏️ Enter new name', user.name);
            if (newName === null) return;
            const newEmail = prompt('📧 Enter new email', user.email);
            if (newEmail === null) return;
            const updatedData = { name: newName, email: newEmail };
            const updateRes = await fetch(`${API_BASE_URL}/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            });
            if (!updateRes.ok) throw new Error('Update failed');
            alert('✅ User updated');
            renderUsers();
        } catch (err) {
            alert('❌ Edit error: ' + err.message);
        }
    };

    document.getElementById('refreshBtn').addEventListener('click', () => renderUsers());
    renderUsers();
</script>
</body>
</html>
